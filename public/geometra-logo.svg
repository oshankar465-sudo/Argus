<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Circle Fill -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>

    <!-- Metallic Upper Blade Highlight (Top Facet) -->
    <linearGradient id="upperBladeTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Metallic Upper Blade Shadow (Bottom Facet) -->
    <linearGradient id="upperBladeBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Metallic Lower Blade Highlight -->
    <linearGradient id="lowerBladeTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Metallic Lower Blade Shadow -->
    <linearGradient id="lowerBladeBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Outer White Circle Badge -->
  <circle cx="256" cy="256" r="252" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="4" />

  <!-- Main Dark G-Geometry Glyph -->
  <!-- Stylized G glyph with circular negative cutout and horizontal bar -->
  <g fill="#242528">
    <path d="M 256 104 C 172 104 104 172 104 256 C 104 340 172 408 256 408 C 340 408 408 340 408 256 L 356 256 C 356 311 311 356 256 356 C 201 356 156 311 156 256 C 156 201 201 156 256 156 C 286 156 313 170 331 192 L 396 192 C 367 139 316 104 256 104 Z" />
    <!-- Center circular core block -->
    <path d="M 230 240 C 230 205 258 177 293 177 C 318 177 340 192 350 213 L 260 213 C 248 213 238 223 238 235 L 238 277 C 238 289 248 299 260 299 L 400 299 L 400 238 L 300 238 L 300 240 Z" />
    <!-- Solid base segment -->
    <path d="M 126 230 C 130 180 166 138 214 122 L 214 240 Z" />
    <path d="M 226 240 L 388 240 L 396 370 C 358 404 309 424 256 424 C 163 424 88 349 88 256 C 88 228 95 201 107 178 L 226 240 Z" />
  </g>

  <!-- Upper Diagonal Sharp Silver Blade (piercing up-right) -->
  <g>
    <!-- Top facet -->
    <polygon points="264,240 416,102 320,240" fill="url(#upperBladeTop)" />
    <!-- Main chisel body -->
    <polygon points="260,240 416,102 386,240" fill="url(#upperBladeBottom)" />
    <polygon points="258,240 416,102 310,236" fill="#F8FAFC" opacity="0.8" />
  </g>

  <!-- Lower Diagonal Sharp Silver Blade (piercing down-left) -->
  <g>
    <!-- Top facet highlight -->
    <polygon points="230,270 298,270 194,402 106,384" fill="url(#lowerBladeTop)" />
    <!-- Beveled chisel face -->
    <polygon points="298,270 208,400 194,402 230,270" fill="url(#lowerBladeBottom)" />
    <!-- Accent line -->
    <polygon points="106,384 194,402 112,392" fill="#E2E8F0" />
  </g>
</svg>
